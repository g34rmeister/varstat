<title>VarStat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>/* Layout: desktop-style workbench — menu bar on top, data sheet (left) beside a running report (right); tabs at phone width. */
:root {
  --bg: #eef1ec;
  --surface: #ffffff;
  --surface-2: #e4e9e2;
  --ink: #18261f;
  --muted: #56655d;
  --line: #cfd8cf;
  --accent: #2c6a4c;
  --accent-ink: #ffffff;
  --accent-soft: #d8e9de;
  --sel: #c7e0d1;
  --warn: #8a5300;
  --warn-soft: #f8ebd2;
  --danger: #a3312a;
  --chart-bg: #ffffff;
  --grid: #e3e9e3;
  --bar: #cfe3d6;
  --bar-edge: #6f9a82;
  --accent-2: #b5651d;
  --shadow: 0 10px 30px rgba(22, 40, 31, 0.16);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --surface: #172019; --surface-2: #1f2a23; --ink: #e2ebe4; --muted: #9aaba1; --line: #2d3a32;
    --accent: #74c399; --accent-ink: #0c1610; --accent-soft: #213a2c; --sel: #24412f; --warn: #e5b25c; --warn-soft: #3a2c14; --danger: #f08a80;
    --chart-bg: #172019; --grid: #26322b; --bar: #284634; --bar-edge: #74c399; --accent-2: #e59b5a; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --surface: #172019; --surface-2: #1f2a23; --ink: #e2ebe4; --muted: #9aaba1; --line: #2d3a32;
  --accent: #74c399; --accent-ink: #0c1610; --accent-soft: #213a2c; --sel: #24412f; --warn: #e5b25c; --warn-soft: #3a2c14; --danger: #f08a80;
  --chart-bg: #172019; --grid: #26322b; --bar: #284634; --bar-edge: #74c399; --accent-2: #e59b5a; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; min-height: 0; }

/* ---- top bar ---- */
.topbar { display: flex; align-items: center; gap: 18px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.plotmark { display: grid; grid-template-columns: repeat(3, 7px); gap: 2px; }
.plotmark i { width: 7px; height: 7px; background: var(--accent); border-radius: 1px; }
.plotmark i:nth-child(2), .plotmark i:nth-child(6), .plotmark i:nth-child(7) { opacity: .35; }
.plotmark i:nth-child(4), .plotmark i:nth-child(9) { opacity: .65; }
.brand b { font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.menubar { display: flex; gap: 2px; flex-wrap: wrap; }
.menu { position: relative; }
.menu > button { background: none; border: 0; padding: 6px 11px; border-radius: var(--r); cursor: pointer; font-weight: 500; }
.menu > button:hover, .menu.open > button { background: var(--surface-2); }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; min-width: 270px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; z-index: 50; display: none; }
.menu.open .dropdown { display: block; }
.dropdown button { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 5px; cursor: pointer; gap: 16px; }
.dropdown button:hover { background: var(--accent-soft); }
.dropdown button small { color: var(--muted); }
.dropdown hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.dropdown .sub-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 10px 2px; }
.topbar .spacer { flex: 1; }
.dsname { font-family: var(--f-data); font-size: 12px; color: var(--muted); }

.tabs { display: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 16px; gap: 4px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button.on { color: var(--ink); border-color: var(--accent); }

/* ---- panes ---- */
.panes { display: grid; grid-template-columns: minmax(320px, 42%) 1fr; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.pane-head h2 { font-family: var(--f-display); font-size: 15px; margin: 0; font-weight: 600; }
.pane-head .meta { color: var(--muted); font-size: 12px; font-family: var(--f-data); }
.pane-head .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: var(--r); cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---- data grid ---- */
.grid-wrap { flex: 1; overflow: auto; min-height: 0; background: var(--surface); }
table.sheet { border-collapse: separate; border-spacing: 0; font-family: var(--f-data); font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.sheet th, table.sheet td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; height: 26px; }
table.sheet thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; font-family: var(--f-body); font-weight: 600; text-align: left; }
table.sheet thead th .colh { display: flex; align-items: center; gap: 6px; padding: 3px 8px; min-width: 96px; cursor: pointer; }
table.sheet thead th .colh:hover { background: var(--accent-soft); }
.typetag { font-family: var(--f-data); font-size: 10px; font-weight: 600; padding: 0 4px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
.typetag.t { background: var(--warn-soft); color: var(--warn); }
table.sheet tbody th { position: sticky; left: 0; background: var(--surface-2); color: var(--muted); font-weight: 400; text-align: right; padding: 0 8px; min-width: 42px; z-index: 1; }
table.sheet thead th.corner { left: 0; z-index: 3; }
table.sheet td input { width: 100%; min-width: 96px; border: 0; background: transparent; padding: 3px 8px; height: 25px; font-family: var(--f-data); font-size: 12.5px; }
table.sheet td.num input { text-align: right; }
table.sheet td input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
table.sheet td.missing input::placeholder { color: var(--muted); opacity: .6; }
.grid-foot { padding: 6px 16px; border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---- report ---- */
.report-wrap { flex: 1; overflow: auto; min-height: 0; padding: 18px 22px 40px; }
.report { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.entry-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; flex-wrap: wrap; }
.entry-head h1 { font-family: var(--f-display); font-size: 18px; margin: 0; font-weight: 650; text-wrap: balance; }
.entry-head .stamp { color: var(--muted); font-size: 12px; font-family: var(--f-data); }
.entry-head .tools { margin-left: auto; display: flex; gap: 4px; }
.entry .example-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); background: var(--warn-soft); padding: 1px 7px; border-radius: 10px; }
.entry h2 { font-family: var(--f-display); font-size: 16px; margin: 6px 0 0; font-weight: 600; }
.entry h3 { font-size: 14px; margin: 6px 0 0; font-weight: 700; }
.entry h4, .entry h5 { font-size: 13px; margin: 4px 0 0; font-weight: 600; color: var(--muted); }
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table.res { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 60%; }
table.res caption { text-align: left; font-weight: 600; padding: 2px 0 6px; font-size: 13px; }
table.res th { text-align: right; font-weight: 600; padding: 5px 10px; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--ink); white-space: nowrap; font-size: 12px; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res td { text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--grid); font-family: var(--f-data); font-size: 12.5px; white-space: nowrap; }
table.res td.txt { font-family: var(--f-body); font-size: 13px; text-align: left; white-space: normal; }
table.res td.grp { font-weight: 700; color: var(--accent); text-align: left; letter-spacing: .04em; }
table.res tr:last-child td { border-bottom: 1.5px solid var(--ink); }
table.res tr.em td { font-weight: 600; }
table.res td.sig { color: var(--accent); font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content max-content; gap: 3px 18px; font-size: 13px; }
.kv.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 28px; }
.kv.two > div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.kv span:nth-child(odd), .kv.two > div > span:first-child { color: var(--muted); }
.kv .v { font-family: var(--f-data); font-size: 12.5px; text-align: right; }
.kv .v.s { font-family: var(--f-body); font-size: 13px; text-align: left; }
.kv-title { font-weight: 600; font-size: 13px; }
.note { color: var(--muted); font-size: 12.5px; }
.warning { background: var(--warn-soft); color: var(--warn); padding: 6px 10px; border-radius: var(--r); font-size: 13px; }
.chart { display: flex; flex-direction: column; gap: 6px; max-width: 680px; }
.chart svg { width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--r); }
.chart .c-title { font-family: var(--f-display); font-size: 16px; font-weight: 600; }
.chart .c-tick { font-family: var(--f-data); font-size: 11.5px; }
.chart .c-label { font-family: var(--f-body); font-size: 13px; }
.chart-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chart-edit { display: grid; grid-template-columns: max-content 1fr; gap: 4px 8px; align-items: center; font-size: 12px; }
.chart-edit input { border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; background: var(--surface); }
.report-empty { color: var(--muted); text-align: center; padding: 40px 10px; border: 1px dashed var(--line); border-radius: 8px; }

/* ---- status bar ---- */
.status { padding: 4px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--surface); display: flex; gap: 12px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }

/* ---- dialogs ---- */
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 14, .45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow: auto; }
.dialog { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); width: min(900px, 100%); display: flex; flex-direction: column; max-height: 92vh; min-height: 0; }
.dialog.narrow { width: min(560px, 100%); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-head h3 { font-family: var(--f-display); font-size: 18px; margin: 0; font-weight: 650; }
.dlg-head .x { margin-left: auto; }
.dlg-body { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.dlg-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.dlg-foot .left { margin-right: auto; color: var(--muted); font-size: 12px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; }
.steps button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps button .n { font-family: var(--f-data); margin-right: 6px; opacity: .8; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.field input[type=text], .field input[type=number], .field select, .field textarea, input.inp, select.inp {
  border: 1px solid var(--line); border-radius: var(--r); padding: 6px 9px; background: var(--surface); min-width: 0; }
.field textarea { font-family: var(--f-data); font-size: 12.5px; min-height: 90px; resize: vertical; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 140px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.listbox { border: 1px solid var(--line); border-radius: var(--r); min-height: 120px; max-height: 240px; overflow: auto; background: var(--surface); }
.listbox .item { display: flex; align-items: center; gap: 8px; padding: 5px 9px; cursor: pointer; border-bottom: 1px solid var(--grid); user-select: none; }
.listbox .item:last-child { border-bottom: 0; }
.listbox .item:hover { background: var(--accent-soft); }
.listbox .item.sel { background: var(--sel); }
.listbox .item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listbox .item.disabled { opacity: .45; cursor: default; }
.listbox .empty { color: var(--muted); padding: 10px; font-size: 13px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.checks label, label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.term-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; }
.editor-line { display: flex; gap: 6px; flex-wrap: wrap; }
.editor-line input { flex: 1 1 200px; font-family: var(--f-data); }
.opbtn { font-family: var(--f-data); min-width: 34px; }
.callout { background: var(--accent-soft); border-radius: var(--r); padding: 8px 12px; font-size: 13px; }
.src-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.src-card .src-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.src-card .src-title b { font-family: var(--f-data); }
.opt-row { display: grid; grid-template-columns: minmax(140px, 1.3fr) 90px minmax(120px, 1fr) auto; gap: 8px; align-items: end; background: var(--bg); padding: 8px; border-radius: var(--r); }
.opt-extra { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-family: var(--f-data); }
.pill.err { background: var(--warn-soft); color: var(--warn); }
.result-live { font-family: var(--f-data); background: var(--bg); border-radius: var(--r); padding: 10px 12px; font-size: 13px; display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 200; font-size: 13px; box-shadow: var(--shadow); max-width: min(560px, 90vw); }
.busy { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 150; background: rgba(10,20,14,.25); }
.busy div { background: var(--surface); padding: 14px 20px; border-radius: 8px; box-shadow: var(--shadow); font-weight: 600; }
.help h4 { margin: 10px 0 4px; font-size: 14px; color: var(--ink); }
.help p, .help li { max-width: 68ch; }
.help code, .mono { font-family: var(--f-data); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }
.help table { border-collapse: collapse; font-size: 13px; }
.help td { padding: 3px 12px 3px 0; vertical-align: top; }

@media (max-width: 820px) {
  .tabs { display: flex; }
  .panes { grid-template-columns: 1fr; }
  .pane + .pane { border-left: 0; }
  .panes[data-tab="data"] .pane.report-pane, .panes[data-tab="report"] .pane.data-pane { display: none; }
  .cols2, .cols3 { grid-template-columns: 1fr; }
  .opt-row { grid-template-columns: 1fr 1fr; }
  .report-wrap { padding: 12px 16px 30px; }
  .entry { padding: 12px; }
  .dropdown { position: fixed; left: 16px; right: 16px; top: 56px; min-width: 0; max-height: 75vh; overflow: auto; }
  .topbar { gap: 8px; }
  .topbar label.dsname { display: none; }
  .topbar .spacer { display: none; }
  .pane-head .tools .btn { padding: 4px 8px; font-size: 12px; }
  .kv.two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .dialog { animation: rise .16s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media print { .topbar, .tabs, .data-pane, .status, .entry-head .tools, .chart-tools { display: none !important; } .panes { display: block; } }
</style>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="plotmark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><b>VarStat</b></div>
    <nav id="menubar" class="menubar" aria-label="Main menu"></nav>
    <span class="spacer"></span>
    <label class="dsname" for="lang" data-i18n="Language">Language</label>
    <select id="lang" class="inp" style="padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></select>
  </header>
  <nav class="tabs" aria-label="Views">
    <button data-t="data" data-i18n="Data">Data</button>
    <button data-t="report" data-i18n="Report">Report</button>
  </nav>
  <main class="panes" data-tab="data">
    <section class="pane data-pane" aria-label="Data">
      <div class="pane-head">
        <h2 data-i18n="Data">Data</h2>
        <span class="meta"><span id="dsname"></span> · <span id="dsmeta"></span></span>
        <span class="tools">
          <button class="btn" id="btn-open" data-i18n="Open file…">Open file…</button>
          <button class="btn" id="btn-examples" data-i18n="Examples">Examples</button>
        </span>
      </div>
      <div class="grid-wrap" id="grid"></div>
      <div class="grid-foot"><span data-i18n="Click a column name to rename it or change its type. Drop a CSV, Excel or ODS file anywhere to open it.">Click a column name to rename it or change its type. Drop a CSV, Excel or ODS file anywhere to open it.</span></div>
    </section>
    <section class="pane report-pane" aria-label="Report">
      <div class="pane-head">
        <h2 data-i18n="Report">Report</h2>
        <span class="tools">
          <button class="btn primary" id="btn-anova" data-i18n="Analysis of variance…">Analysis of variance…</button>
          <button class="btn" id="btn-copyrep" data-i18n="Copy report">Copy report</button>
          <button class="btn" id="btn-saverep" data-i18n="Save report">Save report</button>
        </span>
      </div>
      <div class="report-wrap"><div class="report" id="report"></div></div>
    </section>
  </main>
  <footer class="status"><span data-i18n="All calculations run on this computer. Nothing is uploaded.">All calculations run on this computer. Nothing is uploaded.</span></footer>
</div>

<script>
/* VarStat — localization. Keys are the English source strings; {0}, {1}… are placeholders. */
(function (root) {
  'use strict';
  const LANGS = [['en', 'English'], ['pt', 'Português'], ['es', 'Español'], ['tl', 'Tagalog']];
  const dicts = { en: {}, pt: {}, es: {}, tl: {} };
  let lang = 'en';
  const fill = (s, a) => s.replace(/\{(\d+)\}/g, (m, i) => (a[i] !== undefined ? a[i] : m));
  const I18N = {
    LANGS,
    get lang() { return lang; },

 "help.models": "<p>List the sources of variation in the order they should be fitted. Sums of squares are sequential (type I), which is exact for balanced experiments. The last error is always computed by difference, so you never type it.</p>\n      <h4>Writing sources</h4>\n      <table><tr><td><code>Trt</code></td><td>main effect of a column</td></tr>\n      <tr><td><code>A*B</code></td><td>interaction (add <code>A</code> and <code>B</code> first)</td></tr>\n      <tr><td><code>Tree(Prov)</code>, <code>Tree(Prov*Species)</code></td><td>nested (hierarchical) effect; only one level of parentheses</td></tr>\n      <tr><td><code>error=Block*A</code></td><td>an intermediate error. Every effect listed before it (and after any earlier error) is tested against it.</td></tr>\n      <tr><td><code>[Name with spaces]</code></td><td>quote column names that contain spaces or symbols</td></tr></table>\n      <h4>Common designs</h4>\n      <table>\n      <tr><td>Completely randomized</td><td><code>Trt</code></td></tr>\n      <tr><td>Randomized blocks</td><td><code>Block</code>, <code>Trt</code></td></tr>\n      <tr><td>Latin square</td><td><code>Row</code>, <code>Column</code>, <code>Trt</code></td></tr>\n      <tr><td>Factorial in blocks</td><td><code>Block</code>, <code>A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Split plot in blocks</td><td><code>Block</code>, <code>A</code>, <code>error=Block*A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Split plot, completely randomized</td><td><code>A</code>, <code>error=Rep(A)</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Split plot in time (blocks)</td><td><code>Block</code>, <code>A</code>, <code>error=Block*A</code>, <code>Time</code>, <code>error=Block*Time</code>, <code>A*Time</code></td></tr>\n      <tr><td>Samples within plots</td><td><code>Block</code>, <code>Trt</code>, <code>error=Block*Trt</code></td></tr></table>\n      <h4>When the whole plot holds a factorial</h4>\n      <p>If factors A and B are both on the whole plot, compute a new column with the A×B combinations (e.g. <em>Treatment</em>) and write <code>error=Block*Treatment</code>.</p>\n      <h4>Unfolding interactions and complex variances</h4>\n      <p>For an interaction you choose the factor to compare within each level of the others. With more than one error, comparisons of a whole-plot factor within sub-plot levels need a complex variance VC = [MS(error a) + b·MS(error b)] / k, whose degrees of freedom come from Satterthwaite’s formula. In a split plot with J blocks and b sub-plot levels, comparing A within B uses b − 1 for <em>b</em>, b for <em>k</em>, error a = 1 and error b = 2.</p>\n      <h4>Tests available for each source</h4>\n      <p>Tukey, Student–Newman–Keuls, Bonferroni t, t (LSD), Scott–Knott, Waller–Duncan (k-ratio), contrasts (t, F and Scheffé) and regression on quantitative levels with 24 possible terms. Up to 7 tests per source. Unbalanced designs use the harmonic mean of the number of replicates.</p>",
 "help.about": "<p><b>VarStat</b> is an English, cross-platform statistics workbench for designed experiments. It runs in any modern browser on macOS, Windows, Linux and ChromeOS, and as an installed app. Every calculation stays on your computer.</p>\n      <p>Its menus, model language and methods follow <b>Sisvar</b>, the program by Prof. Daniel Furtado Ferreira (DES/UFLA, Brazil). VarStat is an independent reimplementation, not affiliated with UFLA. If its methods support your work, the citations Sisvar's author recommends are:</p>\n      <ul><li>Ferreira, D. F. (2019). Sisvar: a computer analysis system to fixed effects split plot type designs. <i>Revista Brasileira de Biometria</i>, 37(4), 529–535.</li>\n      <li>Ferreira, D. F. (2014). Sisvar: a guide for its bootstrap procedures in multiple comparisons. <i>Ciência e Agrotecnologia</i>, 38(2), 109–112.</li>\n      <li>Ferreira, D. F. (2011). Sisvar: a computer statistical analysis system. <i>Ciência e Agrotecnologia</i>, 35(6), 1039–1042.</li></ul>\n      <p>Original Sisvar for Windows and Linux: <a href=\"https://des.ufla.br/~danielff/sisvar_windows11.html\" target=\"_blank\" rel=\"noopener\">des.ufla.br/~danielff</a></p>"

"help.models": "<p>Liste as fontes de variação (FV) na ordem em que devem ser ajustadas. As somas de quadrados são sequenciais (tipo I), exatas para experimentos balanceados. O último erro é sempre calculado por diferença (o <em>Fim</em> do Sisvar), portanto você nunca o digita.</p>\n<h4>Como escrever as FV</h4>\n<table><tr><td><code>Trat</code></td><td>efeito principal de uma coluna</td></tr>\n      <tr><td><code>A*B</code></td><td>interação (adicione <code>A</code> e <code>B</code> antes)</td></tr>\n      <tr><td><code>Arvore(Proc)</code>, <code>Arvore(Proc*Especie)</code></td><td>efeito hierárquico (aninhado); apenas um nível de parênteses</td></tr>\n      <tr><td><code>error=Bloco*A</code></td><td>um erro intermediário. Todo efeito listado antes dele (e depois de um erro anterior) é testado por ele.</td></tr>\n      <tr><td><code>[Nome com espaços]</code></td><td>use colchetes em nomes de colunas com espaços ou símbolos</td></tr></table>\n<h4>Delineamentos comuns</h4>\n<table>\n      <tr><td>Inteiramente casualizado (DIC)</td><td><code>Trat</code></td></tr>\n      <tr><td>Blocos casualizados (DBC)</td><td><code>Bloco</code>, <code>Trat</code></td></tr>\n      <tr><td>Quadrado latino</td><td><code>Linha</code>, <code>Coluna</code>, <code>Trat</code></td></tr>\n      <tr><td>Fatorial em blocos</td><td><code>Bloco</code>, <code>A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Parcela subdividida em blocos</td><td><code>Bloco</code>, <code>A</code>, <code>error=Bloco*A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Parcela subdividida no DIC</td><td><code>A</code>, <code>error=Rep(A)</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Parcela subdividida no tempo (blocos)</td><td><code>Bloco</code>, <code>A</code>, <code>error=Bloco*A</code>, <code>Tempo</code>, <code>error=Bloco*Tempo</code>, <code>A*Tempo</code></td></tr>\n      <tr><td>Amostras dentro de parcelas</td><td><code>Bloco</code>, <code>Trat</code>, <code>error=Bloco*Trat</code></td></tr></table>\n<h4>Quando a parcela contém um fatorial</h4>\n<p>Se os fatores A e B estão ambos na parcela, crie uma nova coluna com as combinações A×B (por exemplo, <em>Tratamento</em>) e escreva <code>error=Bloco*Tratamento</code>.</p>\n<h4>Desdobramento de interações e variâncias complexas</h4>\n<p>Numa interação você escolhe o fator a comparar dentro de cada nível dos demais. Com mais de um erro, comparar um fator da parcela dentro de níveis da subparcela exige uma variância complexa VC = [QM(erro a) + b·QM(erro b)] / k, com graus de liberdade pela fórmula de Satterthwaite. Numa parcela subdividida com J blocos e b níveis na subparcela, comparar A dentro de B usa b − 1 para <em>b</em>, b para <em>k</em>, erro a = 1 e erro b = 2.</p>\n<h4>Testes disponíveis para cada FV</h4>\n<p>Tukey, Student–Newman–Keuls, t de Bonferroni, t (LSD), Scott–Knott, Waller–Duncan (razão k), contrastes (t, F e Scheffé) e regressão nos níveis quantitativos com 24 termos possíveis. Até 7 testes por FV. Delineamentos desbalanceados usam a média harmônica do número de repetições.</p>",
"help.about": "<p><b>VarStat</b> é um programa de estatística para experimentos, multiplataforma, que funciona em qualquer navegador moderno no macOS, Windows, Linux e ChromeOS, e também como aplicativo instalado. Todos os cálculos ficam no seu computador.</p>\n<p>Seus menus, linguagem de modelos e métodos seguem o <b>Sisvar</b>, programa do Prof. Daniel Furtado Ferreira (DES/UFLA). O VarStat é uma reimplementação independente, sem vínculo com a UFLA. Se os métodos apoiarem o seu trabalho, as citações recomendadas pelo autor do Sisvar são:</p>\n<ul><li>Ferreira, D. F. (2019). Sisvar: a computer analysis system to fixed effects split plot type designs. <i>Revista Brasileira de Biometria</i>, 37(4), 529–535.</li>\n      <li>Ferreira, D. F. (2014). Sisvar: a guide for its bootstrap procedures in multiple comparisons. <i>Ciência e Agrotecnologia</i>, 38(2), 109–112.</li>\n      <li>Ferreira, D. F. (2011). Sisvar: a computer statistical analysis system. <i>Ciência e Agrotecnologia</i>, 35(6), 1039–1042.</li></ul>\n<p>Sisvar original para Windows e Linux: <a href=\"https://des.ufla.br/~danielff/sisvar_windows11.html\" target=\"_blank\" rel=\"noopener\">des.ufla.br/~danielff</a></p>"
});

"help.models": "<p>Liste las fuentes de variación en el orden en que deben ajustarse. Las sumas de cuadrados son secuenciales (tipo I), exactas para experimentos balanceados. El último error siempre se calcula por diferencia, así que nunca lo escribe.</p>\n<h4>Cómo escribir las fuentes</h4>\n<table><tr><td><code>Trat</code></td><td>efecto principal de una columna</td></tr>\n      <tr><td><code>A*B</code></td><td>interacción (agregue antes <code>A</code> y <code>B</code>)</td></tr>\n      <tr><td><code>Arbol(Proc)</code>, <code>Arbol(Proc*Especie)</code></td><td>efecto anidado (jerárquico); solo un nivel de paréntesis</td></tr>\n      <tr><td><code>error=Bloque*A</code></td><td>un error intermedio. Cada efecto listado antes de él (y después de un error anterior) se prueba con él.</td></tr>\n      <tr><td><code>[Nombre con espacios]</code></td><td>use corchetes en nombres de columnas con espacios o símbolos</td></tr></table>\n<h4>Diseños comunes</h4>\n<table>\n      <tr><td>Completamente al azar (DCA)</td><td><code>Trat</code></td></tr>\n      <tr><td>Bloques completos al azar (DBCA)</td><td><code>Bloque</code>, <code>Trat</code></td></tr>\n      <tr><td>Cuadrado latino</td><td><code>Fila</code>, <code>Columna</code>, <code>Trat</code></td></tr>\n      <tr><td>Factorial en bloques</td><td><code>Bloque</code>, <code>A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Parcelas divididas en bloques</td><td><code>Bloque</code>, <code>A</code>, <code>error=Bloque*A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Parcelas divididas en DCA</td><td><code>A</code>, <code>error=Rep(A)</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Parcelas divididas en el tiempo (bloques)</td><td><code>Bloque</code>, <code>A</code>, <code>error=Bloque*A</code>, <code>Tiempo</code>, <code>error=Bloque*Tiempo</code>, <code>A*Tiempo</code></td></tr>\n      <tr><td>Muestras dentro de parcelas</td><td><code>Bloque</code>, <code>Trat</code>, <code>error=Bloque*Trat</code></td></tr></table>\n<h4>Cuando la parcela grande contiene un factorial</h4>\n<p>Si los factores A y B están ambos en la parcela grande, cree una columna nueva con las combinaciones A×B (por ejemplo, <em>Tratamiento</em>) y escriba <code>error=Bloque*Tratamiento</code>.</p>\n<h4>Desdoblamiento de interacciones y varianzas complejas</h4>\n<p>En una interacción usted elige el factor que se compara dentro de cada nivel de los demás. Con más de un error, comparar un factor de la parcela grande dentro de niveles de la subparcela requiere una varianza compleja VC = [CM(error a) + b·CM(error b)] / k, con grados de libertad por la fórmula de Satterthwaite. En parcelas divididas con J bloques y b niveles en la subparcela, comparar A dentro de B usa b − 1 para <em>b</em>, b para <em>k</em>, error a = 1 y error b = 2.</p>\n<h4>Pruebas disponibles para cada fuente</h4>\n<p>Tukey, Student–Newman–Keuls, t de Bonferroni, t (DMS), Scott–Knott, Waller–Duncan (razón k), contrastes (t, F y Scheffé) y regresión en niveles cuantitativos con 24 términos posibles. Hasta 7 pruebas por fuente. Los diseños desbalanceados usan la media armónica del número de repeticiones.</p>",
"help.about": "<p><b>VarStat</b> es un programa de estadística para experimentos, multiplataforma: funciona en cualquier navegador moderno en macOS, Windows, Linux y ChromeOS, y también como aplicación instalada. Todos los cálculos se quedan en su computadora.</p>\n<p>Sus menús, lenguaje de modelos y métodos siguen a <b>Sisvar</b>, el programa del Prof. Daniel Furtado Ferreira (DES/UFLA, Brasil). VarStat es una reimplementación independiente, sin vínculo con la UFLA. Si los métodos apoyan su trabajo, las citas que recomienda el autor de Sisvar son:</p>\n<ul><li>Ferreira, D. F. (2019). Sisvar: a computer analysis system to fixed effects split plot type designs. <i>Revista Brasileira de Biometria</i>, 37(4), 529–535.</li>\n      <li>Ferreira, D. F. (2014). Sisvar: a guide for its bootstrap procedures in multiple comparisons. <i>Ciência e Agrotecnologia</i>, 38(2), 109–112.</li>\n      <li>Ferreira, D. F. (2011). Sisvar: a computer statistical analysis system. <i>Ciência e Agrotecnologia</i>, 35(6), 1039–1042.</li></ul>\n<p>Sisvar original para Windows y Linux: <a href=\"https://des.ufla.br/~danielff/sisvar_windows11.html\" target=\"_blank\" rel=\"noopener\">des.ufla.br/~danielff</a></p>"
});

"help.models": "<p>Ilista ang mga pinagmulan ng baryasyon ayon sa pagkakasunod kung paano sila iaakma. Sunud-sunod (type I) ang sum of squares, na eksakto para sa balanced na eksperimento. Laging kinakalkula sa pamamagitan ng pagkakaiba ang huling error, kaya hindi mo na ito ita-type.</p>\n<h4>Pagsulat ng mga pinagmulan</h4>\n<table><tr><td><code>Trt</code></td><td>pangunahing epekto ng isang column</td></tr>\n      <tr><td><code>A*B</code></td><td>interaksyon (idagdag muna ang <code>A</code> at <code>B</code>)</td></tr>\n      <tr><td><code>Puno(Prov)</code>, <code>Puno(Prov*Species)</code></td><td>nested (hierarchical) na epekto; isang antas lang ng panaklong</td></tr>\n      <tr><td><code>error=Block*A</code></td><td>isang intermediate na error. Sinusubok gamit ito ang bawat epektong nakalista bago nito (at pagkatapos ng naunang error).</td></tr>\n      <tr><td><code>[Pangalan na may espasyo]</code></td><td>lagyan ng square bracket ang pangalan ng column na may espasyo o simbolo</td></tr></table>\n<h4>Karaniwang disenyo</h4>\n<table>\n      <tr><td>Completely randomized (CRD)</td><td><code>Trt</code></td></tr>\n      <tr><td>Randomized complete blocks (RCBD)</td><td><code>Block</code>, <code>Trt</code></td></tr>\n      <tr><td>Latin square</td><td><code>Row</code>, <code>Column</code>, <code>Trt</code></td></tr>\n      <tr><td>Factorial sa mga block</td><td><code>Block</code>, <code>A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Split plot sa mga block</td><td><code>Block</code>, <code>A</code>, <code>error=Block*A</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Split plot, completely randomized</td><td><code>A</code>, <code>error=Rep(A)</code>, <code>B</code>, <code>A*B</code></td></tr>\n      <tr><td>Split plot sa paglipas ng panahon (mga block)</td><td><code>Block</code>, <code>A</code>, <code>error=Block*A</code>, <code>Panahon</code>, <code>error=Block*Panahon</code>, <code>A*Panahon</code></td></tr>\n      <tr><td>Mga sample sa loob ng plot</td><td><code>Block</code>, <code>Trt</code>, <code>error=Block*Trt</code></td></tr></table>\n<h4>Kapag factorial ang laman ng main plot</h4>\n<p>Kung parehong nasa main plot ang factor A at B, gumawa ng bagong column ng mga kombinasyong A×B (hal. <em>Treatment</em>) at isulat ang <code>error=Block*Treatment</code>.</p>\n<h4>Paghihimay ng interaksyon at complex variance</h4>\n<p>Sa isang interaksyon, pipiliin mo ang factor na ihahambing sa bawat antas ng iba pa. Kapag higit sa isa ang error, ang paghahambing ng main-plot factor sa mga antas ng subplot ay nangangailangan ng complex variance VC = [MS(error a) + b·MS(error b)] / k, na ang degrees of freedom ay mula sa formula ni Satterthwaite. Sa split plot na may J block at b antas sa subplot, ang paghahambing ng A sa loob ng B ay gumagamit ng b − 1 para sa <em>b</em>, b para sa <em>k</em>, error a = 1 at error b = 2.</p>\n<h4>Mga pagsubok para sa bawat pinagmulan</h4>\n<p>Tukey, Student–Newman–Keuls, Bonferroni t, t (LSD), Scott–Knott, Waller–Duncan (k-ratio), mga contrast (t, F at Scheffé) at regression sa mga quantitative na antas na may 24 na posibleng term. Hanggang 7 pagsubok bawat pinagmulan. Ginagamit ng unbalanced na disenyo ang harmonic mean ng bilang ng replicate.</p>",
"help.about": "<p>Ang <b>VarStat</b> ay programa sa estadistika para sa mga eksperimento na gumagana sa anumang modernong browser sa macOS, Windows, Linux at ChromeOS, at bilang naka-install na app. Nananatili sa iyong computer ang lahat ng kalkulasyon.</p>\n<p>Sinusundan ng mga menu, wika ng modelo at pamamaraan nito ang <b>Sisvar</b>, ang programa ni Prof. Daniel Furtado Ferreira (DES/UFLA, Brazil). Ang VarStat ay hiwalay na muling pagpapatupad at hindi kaanib ng UFLA. Kung nakatulong ang mga pamamaraan sa iyong gawain, ito ang mga sangguniang inirerekomenda ng may-akda ng Sisvar:</p>\n<ul><li>Ferreira, D. F. (2019). Sisvar: a computer analysis system to fixed effects split plot type designs. <i>Revista Brasileira de Biometria</i>, 37(4), 529–535.</li>\n      <li>Ferreira, D. F. (2014). Sisvar: a guide for its bootstrap procedures in multiple comparisons. <i>Ciência e Agrotecnologia</i>, 38(2), 109–112.</li>\n      <li>Ferreira, D. F. (2011). Sisvar: a computer statistical analysis system. <i>Ciência e Agrotecnologia</i>, 35(6), 1039–1042.</li></ul>\n<p>Orihinal na Sisvar para sa Windows at Linux: <a href=\"https://des.ufla.br/~danielff/sisvar_windows11.html\" target=\"_blank\" rel=\"noopener\">des.ufla.br/~danielff</a></p>"

    }
    try {
      const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
      if (dl) {

        catch (e) { if (e && e.code === 'declined') { toast(T('Save cancelled')); return; } if (e && e.code === 'rate_limited') { toast(T('A save is already waiting for confirmation')); return; } }

      const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();

        const blocks = R.probability(dist, params());
        for (const b of blocks) if (b.type === 'kv') for (const [k2, v2] of b.rows) out.append(h('span', null, k2), h('span', null, App.fmt(v2, Number.isInteger(v2) ? 'int' : 'num')));
      } catch (e) { out.append(h('span', null, T('Check the inputs')), h('span', null, e.message)); }
    };
    Object.values(F).forEach((e) => e.addEventListener('input', calc));
    const dsel = radioGroup(nid('pd'), [['binom', T('Binomial')], ['pois', T('Poisson')], ['norm', T('Normal')], ['t', 't'], ['chisq', T('Chi-square')], ['f', 'F']], dist, (v) => { dist = v; layout(); });
    layout();
    dialog({ title: T('Probability calculator'), narrow: true, body: [dsel, modeG, fields, out], actions: [{ label: T('Add to report'), primary: true, onClick: (close) => { try { const pp = params(), dd = dist; App.record('Probability calculator', () => R.probability(dd, pp)); close(); } catch (e) { showError(e); } } }] });
  }

  // =====================================================================
  // Estimation & hypothesis tests (shared input form)
  // =====================================================================
  function statForm(kind) {
    const isTest = kind === 'test';
    let param = 'mean', src = 'keyboard';
    const F = { mean: inp({ value: '10' }), sd: inp({ value: '2' }), n: inp({ value: '20' }), N: inp({ placeholder: T('optional') }), variance: inp({ value: '4' }), cv: inp({ value: '20' }), y: inp({ value: '8' }),
      m1: inp({ value: '12' }), s1: inp({ value: '2' }), n1: inp({ value: '10' }), m2: inp({ value: '10' }), s2: inp({ value: '2.5' }), n2: inp({ value: '12' }),
      mu0: inp({ value: '9' }), p0: inp({ value: '0.5' }), sigma2: inp({ value: '3' }), delta0: inp({ value: '0' }) };
    const alpha = inp({ value: '0.05' }), alt = sel(ALTS(), 'two');
    const numVars = varItems((c) => c.type === 'numeric');
    const v = sel(numVars.map((x) => [x.value, x.label]), numVars[0] && numVars[0].value);
    const cls = sel(colNames().map((n) => [n, n]), (S.ds.columns.find((c) => c.type === 'text') || {}).name);
    const area = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } });
    const params = isTest ? [['mean', T('Mean')], ['proportion', T('Proportion')], ['variance', T('Variance')], ['diff', T('Difference between two means')]]
      : [['mean', T('Mean')], ['proportion', T('Proportion')], ['variance', T('Variance')], ['sd', T('Standard deviation')], ['cv', T('Coefficient of variation')], ['diff', T('Difference between two means')]];
    const pSel = radioGroup(nid('par'), params, param, (x) => { param = x; draw(); });
    const sSel = radioGroup(nid('src'), [['keyboard', T('Type summary values')], ['file', T('Compute from the data')]], src, (x) => { src = x; draw(); });
    const H0 = { mean: ['mu0', 'H0: μ ='], proportion: ['p0', 'H0: p ='], variance: ['sigma2', 'H0: σ² ='], diff: ['delta0', 'H0: μ1 − μ2 ='] };
    const draw = () => {
      area.innerHTML = '';
      const row = (...fs) => h('div', { class: 'row' }, ...fs);
      if (src === 'file' && param !== 'proportion') {
        if (param === 'diff') area.append(row(field(T('Variable'), v), field(T('Classification variable (2 levels)'), cls)));
        else area.append(row(field(T('Variable'), v)));
      } else {
        if (param === 'mean') area.append(row(field(T('Sample mean (x̄)'), F.mean), field(T('Standard deviation (s)'), F.sd), field(T('Sample size (n)'), F.n), ...(isTest ? [] : [field(T('Population size N'), F.N)])));
        if (param === 'proportion') area.append(row(field(T('Successes (y)'), F.y), field(T('Sample size (n)'), F.n), ...(isTest ? [] : [field(T('Population size N'), F.N)])));
        if (param === 'variance') area.append(row(field(T('Sample variance (s²)'), F.variance), field(T('Sample size (n)'), F.n)));
        if (param === 'sd') area.append(row(field(T('Standard deviation (s)'), F.sd), field(T('Sample size (n)'), F.n)));
        if (param === 'cv') area.append(row(field(T('Coefficient of variation (%)'), F.cv), field(T('Sample size (n)'), F.n)));
        if (param === 'diff') area.append(row(field('x̄1', F.m1), field('s1', F.s1), field('n1', F.n1)), row(field('x̄2', F.m2), field('s2', F.s2), field('n2', F.n2)));
        if (param === 'proportion' && src === 'file') area.append(h('p', { class: 'note' }, T('Proportions are entered as counts.')));
      }
      if (isTest) area.append(row(field(H0[param][1], F[H0[param][0]]), field(T('Alternative hypothesis'), alt)));
      area.append(row(field(isTest ? T('Significance level (α)') : T('α (confidence = 1 − α)'), alpha)));
    };
    draw();
    const collect = () => {
      const o = {}; for (const [k2, e] of Object.entries(F)) o[k2] = num(e);
      if (!(o.N > 0)) delete o.N;
      if (src === 'file' && param !== 'proportion') {
        const c = col(v.value); if (!c) throw new Error(T('Select a variable.'));
        if (param === 'diff') {
          const g = col(cls.value), lv = A.levelsOf(g.values);
          if (lv.length !== 2) throw new Error(T('The classification variable must have exactly 2 levels (it has {0}).', lv.length));
          const part = (L) => c.values.filter((x, i) => typeof x === 'number' && String(g.values[i]) === String(L));
          const a = R.summarize(part(lv[0])), b = R.summarize(part(lv[1]));
          Object.assign(o, { m1: a.mean, s1: a.sd, n1: a.n, m2: b.mean, s2: b.sd, n2: b.n, groupNames: lv });
        } else { const s = R.summarize(window.Data.numericValues(c)); Object.assign(o, s); }
      }
      return o;
    };
    return { pSel, sSel, area, collect, alpha: () => (num(alpha) > 0 && num(alpha) < 1 ? num(alpha) : 0.05), alt: () => alt.value, param: () => param, src: () => src, v, cls };
  }
  function estimation() {
    const f = statForm('ci');
    dialog({ title: T('Estimation (confidence intervals)'), body: [h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Parameter')), f.pSel), h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Data entry')), f.sSel), f.area],
      actions: [{ label: T('Compute'), primary: true, onClick: (close) => { try { const o = f.collect(), par = f.param(), al = f.alpha(), vn = f.v.value, cn = f.cls.value, fromFile = f.src() === 'file' && par !== 'proportion'; App.record('Estimation', () => { const bl = R.estimation(par, o, al); if (o.groupNames) bl.splice(1, 0, { type: 'note', text: T('Group 1 = {0}, group 2 = {1} ({2} by {3}).', o.groupNames[0], o.groupNames[1], vn, cn) }); else if (fromFile) bl.splice(1, 0, { type: 'note', text: T('Variable: {0}', vn) }); return bl; }); close(); } catch (e) { showError(e); } } }] });
  }
  function hypothesis() {
    const f = statForm('test');
    dialog({ title: T('Hypothesis tests'), body: [h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Parameter')), f.pSel), h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Data entry')), f.sSel), f.area],
      actions: [{ label: T('Test'), primary: true, onClick: (close) => { try { const o = f.collect(), par = f.param(), al = f.alpha(), alt = f.alt(), vn = f.v.value, cn = f.cls.value, fromFile = f.src() === 'file' && par !== 'proportion'; App.record('Hypothesis tests', () => { const bl = R.hypothesis(par, o, al, alt); if (o.groupNames) bl.splice(1, 0, { type: 'note', text: T('Group 1 = {0}, group 2 = {1} ({2} by {3}).', o.groupNames[0], o.groupNames[1], vn, cn) }); else if (fromFile) bl.splice(1, 0, { type: 'note', text: T('Variable: {0}', vn) }); return bl; }); close(); } catch (e) { showError(e); } } }] });
  }

  // =====================================================================
  // Regression term builder (regression & model selection)
  // =====================================================================
  function termBuilder(terms) {
    const editor = inp({ placeholder: T('e.g. X1, X1^2, X2*X3, (X2*X3)^0.5'), 'aria-label': T('Regressor') });
    const vars = listbox(varItems((c) => c.type === 'numeric'), { onActivate: (v, dbl) => { if (dbl) { terms.push(quoteName(v)); draw(); } else { editor.value += quoteName(v); editor.focus(); } } });
    const list = h('div', { class: 'listbox', style: { minHeight: '150px' } });
    const draw = () => { list.innerHTML = ''; if (!terms.length) list.append(h('div', { class: 'empty' }, T('No regressors yet.'))); terms.forEach((t, i) => list.append(h('div', { class: 'item' }, h('span', { class: 'pill' }, 'b' + (i + 1)), h('span', { class: 'grow mono' }, t), h('button', { class: 'btn ghost sm', 'aria-label': T('Remove'), onclick: () => { terms.splice(i, 1); draw(); } }, '✕')))); };
    const add = () => { const t = editor.value.trim(); if (!t) return; try { window.Regress.parseExpr(t, colNames()); terms.push(t); editor.value = ''; draw(); } catch (e) { showError(e); } };
    editor.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    draw();
    const ops = ['+', '-', '*', '/', '^', '(', ')'].map((o) => h('button', { class: 'btn opbtn', onclick: () => { editor.value += o; editor.focus(); } }, o));
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
      h('div', { class: 'cols2' }, h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Variables (click to insert, double-click to add)')), vars), h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Regressors in the model')), list, h('div', null, h('button', { class: 'btn sm', onclick: () => { terms.length = 0; draw(); } }, T('Clear'))))),
      h('div', { class: 'field' }, h('label', { for: editor.id }, T('Build a regressor')), h('div', { class: 'editor-line' }, editor, ...ops, h('button', { class: 'btn primary', onclick: add }, T('Add')))));
  }
  function regression() {
    if (!requireData()) return;
    const st = S.lastReg && S.lastReg.dsName === S.dsName ? S.lastReg : (S.lastReg = { dsName: S.dsName, terms: [], y: [] });
    const ys = listbox(varItems((c) => c.type === 'numeric'), { multi: true, selected: st.y });
    const o = { type1: chk(T('Type I sums of squares'), true), type2: chk(T('Type II sums of squares'), true), partialR2: chk(T('Partial and semipartial R²'), false), xtx: chk("X'X", false), xtxi: chk("(X'X)⁻¹", false), predicted: chk(T('Predicted values and residuals (with diagnostics)'), false), standardized: chk(T('Standardized coefficients'), false) };
    const alpha = inp({ value: '0.05' });
    dialog({ title: T('Linear regression'), body: [termBuilder(st.terms), h('div', { class: 'cols2' }, h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Response variables (Y)')), ys), h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Options')), h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } }, ...Object.values(o).map((x) => x.el), field(T('α for confidence intervals'), alpha))))],
      actions: [{ label: T('Fit'), primary: true, onClick: (close) => {
        st.y = ys.getSelected();
        if (!st.terms.length) return toast(T('Add at least one regressor.'));
        if (!st.y.length) return toast(T('Select a response variable.'));
        const opts = Object.fromEntries(Object.entries(o).map(([k, x]) => [k, x.c.checked])); opts.alpha = num(alpha) > 0 && num(alpha) < 1 ? num(alpha) : 0.05;
        const ds = App.snapshot(), terms = st.terms.slice(), ys2 = st.y.slice(); busy(T('Computing…'), () => { try { App.record('Linear regression', () => R.regression(ds, terms, ys2, opts)); close(); } catch (e) { showError(e); } });
      } }] });
  }
  function selection() {
    if (!requireData()) return;
    const st = S.lastSel && S.lastSel.dsName === S.dsName ? S.lastSel : (S.lastSel = { dsName: S.dsName, terms: [] });
    const items = varItems((c) => c.type === 'numeric');
    const y = sel(items.map((x) => [x.value, x.label]), st.y || (items[0] && items[0].value));
    let method = 'stepwise';
    const mg = radioGroup(nid('m'), [['backward', 'Backward'], ['forward', 'Forward'], ['stepwise', 'Stepwise']], method, (m) => { method = m; });
    const ain = inp({ value: '0.15' }), aout = inp({ value: '0.15' });
    dialog({ title: T('Model selection'), body: [field(T('Response variable (Y)'), y), h('span', { class: 'lbl' }, T('Candidate regressors')), termBuilder(st.terms), h('div', { class: 'row' }, h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Method')), mg), field(T('Significance level to enter'), ain), field(T('Significance level to stay'), aout))],
      actions: [{ label: T('Select model'), primary: true, onClick: (close) => {
        st.y = y.value;
        if (st.terms.length < 1) return toast(T('Add candidate regressors.'));
        const ds = App.snapshot(), terms = st.terms.slice(), yy = y.value, so = { method, alphaIn: num(ain) || 0.15, alphaOut: num(aout) || 0.15 }; busy(T('Computing…'), () => { try { App.record('Model selection', () => R.selection(ds, terms, yy, so)); close(); } catch (e) { showError(e); } });
      } }] });
  }

  // =====================================================================
  // Bootstrap multiple comparisons
  // =====================================================================
  function bootstrap() {
    if (!requireData()) return;
    const cls = sel(colNames().map((n) => [n, n]), (S.ds.columns.find((c) => c.type === 'text') || S.ds.columns[0]).name);
    const ys = listbox(varItems((c) => c.type === 'numeric'), { multi: true });
    let method = 'tukey';
    const ctrl = sel([], '');
    const fillCtrl = () => { ctrl.innerHTML = ''; const c = col(cls.value); if (c) A.levelsOf(c.values).forEach((l) => ctrl.append(h('option', { value: String(l) }, String(l)))); };
    cls.addEventListener('change', fillCtrl); fillCtrl();
    const ctrlF = field(T('Control treatment'), ctrl); ctrlF.hidden = true;
    const mg = radioGroup(nid('bm'), [['tukey', 'Tukey'], ['snk', 'SNK'], ['scottknott', 'Scott–Knott'], ['control', T('Comparisons with a control')]], method, (m) => { method = m; ctrlF.hidden = m !== 'control'; });
    const B = inp({ value: '2000' }), alpha = inp({ value: '0.05' });
    dialog({ title: T('Multiple comparisons by bootstrap'), body: [h('div', { class: 'cols2' }, h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } }, field(T('Classification variable (treatments)'), cls), h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Procedure')), mg), ctrlF), h('div', { class: 'field' }, h('span', { class: 'lbl' }, T('Dependent variables')), ys)), h('div', { class: 'row' }, field(T('Bootstrap resamples'), B), field(T('Nominal significance level'), alpha))],
      actions: [{ label: T('Analyse'), primary: true, onClick: (close) => {
        const y = ys.getSelected().filter((n) => n !== cls.value); if (!y.length) return toast(T('Select at least one dependent variable.'));
        const ds = App.snapshot(), cv = cls.value, bo = { method, B: Math.max(200, Math.round(num(B)) || 2000), alpha: num(alpha) > 0 && num(alpha) < 1 ? num(alpha) : 0.05, control: ctrl.value }; busy(T('Resampling…'), () => { try { App.record('Multiple comparisons (bootstrap)', () => R.bootstrapMCP(ds, cv, y, bo)); close(); } catch (e) { showError(e); } });
      } }] });
  }

  // =====================================================================
  // Experimental plans
  // =====================================================================
  function plans() {
    let design = 'rcbd';
    const reps = inp({ value: '4' }), first = inp({ value: '1' }), k = inp({ value: '3' }), lreps = inp({ value: '2' }), lfirst = inp({ value: '1' });
    const plotF = [{ name: 'Trt', levels: 4 }], subF = [];
    const factorEditor = (arr, label, emptyText) => {
      const wrap = h('div', { class: 'field' });
      const draw = () => {
        wrap.innerHTML = '';
        wrap.append(h('span', { class: 'lbl' }, label));
        if (!arr.length) wrap.append(h('div', { class: 'note' }, emptyText));
        arr.forEach((f, i) => { const n = h('input', { class: 'inp', value: f.name, 'aria-label': T('Factor name') }), l = h('input', { class: 'inp', value: String(f.levels), style: { width: '80px' }, inputmode: 'numeric', 'aria-label': T('Number of levels') }); n.addEventListener('input', () => { f.name = n.value.trim(); }); l.addEventListener('input', () => { f.levels = Math.round(num(l)); }); wrap.append(h('div', { class: 'row', style: { alignItems: 'center' } }, n, l, h('span', { class: 'note' }, T('levels')), h('button', { class: 'btn ghost sm', onclick: () => { arr.splice(i, 1); draw(); } }, '✕'))); });
        wrap.append(h('div', null, h('button', { class: 'btn sm', onclick: () => { arr.push({ name: String.fromCharCode(65 + arr.length + (arr === subF ? plotF.length : 0)), levels: 2 }); draw(); } }, T('+ Add factor'))));
      };
      draw(); return wrap;
    };
    const std = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } }, h('div', { class: 'row' }, field(T('Replicates / blocks'), reps), field(T('First plot number'), first)),
      h('div', { class: 'cols2' }, factorEditor(plotF, T('Factors applied to the plots'), ''), factorEditor(subF, T('Factors applied to the subplots (split plot)'), T('None: no split plot.'))));
    const lat = h('div', { class: 'row' }, field(T('Block size k (k² treatments)'), k), field(T('Replicates r (≤ k + 1)'), lreps), field(T('First plot number'), lfirst));
    const show = () => { std.hidden = design === 'lattice'; lat.hidden = design !== 'lattice'; };
    const dg = radioGroup(nid('pl'), [['crd', T('Completely randomized (CRD)')], ['rcbd', T('Randomized complete blocks (RCBD)')], ['lattice', T('Square lattice')]], design, (x) => { design = x; show(); });
    show();
    const make = () => {
      const p = design === 'lattice' ? { design, k: Math.round(num(k)), reps: Math.round(num(lreps)), firstPlot: Math.round(num(lfirst)) || 1 }
        : { design, reps: Math.round(num(reps)), firstPlot: Math.round(num(first)) || 1, plotFactors: plotF.filter((f) => f.name && f.levels >= 1), subFactors: subF.filter((f) => f.name && f.levels >= 1) };
      if (design !== 'lattice' && (!(p.reps >= 1) || !p.plotFactors.length)) throw new Error(T('Give the number of replicates and at least one factor.'));
      p.seed = Math.floor(Math.random() * 2147483647) + 1;
      p.plotFactors = p.plotFactors && JSON.parse(JSON.stringify(p.plotFactors)); p.subFactors = p.subFactors && JSON.parse(JSON.stringify(p.subFactors));
      const r = R.plan(p); r.p = p; return r;
    };
    dialog({ title: T('Experimental plans'), body: [dg, std, lat, h('p', { class: 'note', style: { margin: 0 } }, T('Each run draws a new randomization.'))],
      actions: [
        { label: T('Add plan to report'), onClick: (close) => { try { const r = make(); App.record('Experimental plans', () => R.plan(r.p).blocks); close(); } catch (e) { showError(e); } } },
        { label: T('Add to report and open as data'), primary: true, onClick: (close) => {
          try {
            const r = make(); App.record('Experimental plans', () => R.plan(r.p).blocks);
            const cols = r.res.cols.map((c) => ({ name: ['Plot', 'Rep', 'Block', 'Subplot', 'Treatment'].includes(c) ? T(c) : c, type: 'numeric', values: r.res.rows.map((x) => x[c]) }));
            cols.push({ name: 'Y', type: 'numeric', values: r.res.rows.map(() => null) });
            App.setDataset({ columns: cols }, T('Field plan'), { silent: true }); App.switchTab('data'); close(); toast(T('Plan opened as data. Type the observations in column Y.'));
          } catch (e) { showError(e); }
        } }] });
  }

  window.Dialogs = { anova, descriptive, shapiro, kernel, probability, estimation, hypothesis, regression, selection, bootstrap, plans };
})();
